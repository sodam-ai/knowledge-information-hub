appId: studio.sodam-ai.kih
productName: Knowledge Information Hub
copyright: "© 2026 SoDam AI Studio"

directories:
  output: dist-electron
  buildResources: electron/assets

files:
  - "electron/**/*"
  - "package.json"

asarUnpack:
  - ".next/standalone/**/*"
  - "node_modules/better-sqlite3/**/*"
  - "db/migrations/**/*"

extraResources:
  - from: ".next/standalone"
    to: "app.asar.unpacked/.next/standalone"
    filter: ["**/*"]
  - from: "db/migrations"
    to: "app.asar.unpacked/db/migrations"
    filter: ["**/*"]

# ── Windows ───────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: "KIH-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: "KIH-Setup-${version}-${arch}.${ext}"
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Knowledge Information Hub"

portable:
  artifactName: "KIH-Portable-${version}-${arch}.${ext}"

# ── macOS ─────────────────────────────────────────────────
mac:
  icon: electron/assets/icon.png
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: "KIH-${version}-${arch}.${ext}"
  category: public.app-category.productivity

# ── Linux ─────────────────────────────────────────────────
linux:
  icon: electron/assets/icon.png
  target:
    - AppImage
    - deb
  artifactName: "KIH-${version}-${arch}.${ext}"
  category: Office

# ── publish (GitHub Releases) ─────────────────────────────
publish:
  - provider: github
    releaseType: release
